# Checks that commit messages and the pull request title follow Conventional
# Commits (commitlint.config.mjs). Merge commits are skipped by commitlint.
name: Commit format

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  title:
    name: Pull request title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            week0[1-8]
            site
            analysis
            names
            data
            tests
            ci
            deps
            docs
