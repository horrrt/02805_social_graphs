    </text>
    <g font-size="12" font-weight="600">
      <rect x="44" y="360" width="22" height="3" rx="1.5" fill="#f2820c" />
      <text x="74" y="366" fill="#b9cde4">Migration (people)</text>
      <rect x="44" y="384" width="22" height="3" rx="1.5" fill="#1f8fd6" />
      <text x="74" y="390" fill="#b9cde4">Flights (access)</text>
    </g>
